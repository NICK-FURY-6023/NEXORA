name: Feature request
description: Something NEXORA cannot do yet.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem before the solution — the problem is what makes
        the request worth doing.

        NEXORA's compatibility target is tracked per row in
        `docs/COMPATIBILITY.md`. If your request names a row, say which one.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can you not do today, and what is the cost of that?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like to happen instead. A rough shape is fine.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve the same problem, and why they are worse.
    validations:
      required: false
  - type: dropdown
    id: scope
    attributes:
      label: Area
      options:
        - protocol or API surface
        - audio pipeline
        - sources
        - filters
        - voice
        - docs and tooling
        - other
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility row
      description: >
        Optional. The row id in `docs/COMPATIBILITY.md` this touches, for
        example `Lavalink v4 routes` or `Events`.
    validations:
      required: false
