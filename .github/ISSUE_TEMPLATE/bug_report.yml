name: Bug report
description: Something in NEXORA behaves differently from what it should.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please fill in what you can — a reproduction is
        worth more than a diagnosis.

        If this is a **security problem**, do not file it here: use the private
        route in `SECURITY.md`.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: >
        The track, endpoint or command involved, what you expected instead, and
        what happened instead. Include the exact request or input when you can.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: NEXORA version
      description: The `version` from `/v4/info`, or the commit sha you built.
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps, starting from a fresh server.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >
        Optional. **Redact tokens, passwords, cookies and personal data before
        pasting.** Leave empty if you have none.
      render: text
    validations:
      required: false
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - blocker — nothing works
        - major — a core path is broken
        - minor — something smaller is wrong
        - question — I am not sure this is a bug
    validations:
      required: true
