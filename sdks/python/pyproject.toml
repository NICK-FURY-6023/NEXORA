[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexora-sdk"
version = "0.1.0"
description = "Standard-library Python client for the NEXORA API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools]
packages = ["nexora_sdk"]
