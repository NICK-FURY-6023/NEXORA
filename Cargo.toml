[workspace]
members = [
    "crates/nexora-error",
    "crates/nexora-common",
    "crates/nexora-audio-types",
    "crates/nexora-audio-decode",
    "crates/nexora-audio-codec",
    "crates/nexora-audio-pipeline",
    "crates/nexora-source-api",
    "crates/nexora-source-framework",
    "crates/nexora-session",
    "crates/nexora-grpc",
    "crates/nexora-protocol",
    "crates/nexora-config",
    "crates/nexora-telemetry",
    "crates/nexora-service",
    "services/nexora-gateway",
    "services/nexora-audio-engine",
    "services/nexora-server",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
license = "Apache-2.0"

[workspace.dependencies]
thiserror = "=2.0.21"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
figment = { version = "=0.10.19", features = ["env", "toml"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt"] }
tokio = { version = "=1.54.1", features = ["fs", "macros", "rt-multi-thread", "signal", "sync", "time"] }
clap = { version = "=4.6.9", features = ["derive"] }
symphonia = { version = "=0.6.1", default-features = false, features = ["flac", "mp3", "ogg", "pcm", "vorbis", "wav"] }
rubato = "=5.1.0"
opus-rs = "=0.1.42"
ogg = "=0.9.2"
audioadapter-buffers = "=5.2.0"
audioadapter = "=5.0.0"
criterion = "=0.8.2"
async-trait = "=0.1.92"
axum = { version = "=0.8.9", features = ["ws"] }
tonic = { version = "=0.14.9", features = ["transport"] }
prost = "=0.14.6"
tonic-prost = "=0.14.9"
tokio-stream = "=0.1.19"
