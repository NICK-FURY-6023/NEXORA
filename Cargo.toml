[workspace]
members = [
    "crates/nexora-error",
    "crates/nexora-common",
    "crates/nexora-audio-types",
    "crates/nexora-protocol",
    "crates/nexora-config",
    "crates/nexora-telemetry",
    "crates/nexora-service",
    "services/nexora-gateway",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
license = "Apache-2.0"

[workspace.dependencies]
thiserror = "=2.0.21"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
figment = { version = "=0.10.19", features = ["env", "toml"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt"] }
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
clap = { version = "=4.6.9", features = ["derive"] }
